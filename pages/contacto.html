<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,600;0,700;0,800;1,100;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto - Blockbusterd</title>
  </head>
  <body>
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html">
          <img
            src="../img/blockbuster.png"
            width="200"
            length="200"
            alt="logo"
          />
        </a>
      </div>

      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contacto">
        <h1 class="titulo-contacto text-secondary">Contactanos</h1>
        <form class="form-contacto" action="" method="POST">
          <div class="grupo-input">
            <label for="email">Your email:</label>
            <input id="email" type="email" name="email" />
          </div>

          <div class="grupo-input">
            <label for="mensaje">Your messsage:</label>
            <textarea id="mensaje" name="messsage"></textarea>
          </div>
          <button class="btn bg-secondary text-dark" type="submit">Send</button>
        </form>
      </section>
    </main>
    <footer>
      <p>Sitio realizado por Tomas para Talento Tech</p>
      <nav>
        <ul class="footer-list">
          <li>
            <img src="../img/github-brands-solid.png" alt="logo-github" />
            <img
              src="../img/letterboxd-brands-solid.png"
              alt="logo-letterboxd"
            />
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
